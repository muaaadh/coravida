name: Build and publish

# Every push to main — including the commits the /admin/ editor makes to
# content/site.json and assets/src/ — rebuilds the pages and republishes
# GitHub Pages. A content edit is live about two minutes after Publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write     # the generated pages and photograph tiers are committed back
  pages: write
  id-token: write

# One publish at a time; a queued run waits rather than cancelling, so the
# last edit always wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cut photograph tiers for anything the admin uploaded
        run: |
          if ls assets/src/* >/dev/null 2>&1; then
            npm i --no-save --silent sharp
            node tools/tiers.js
          else
            echo "no uploads"
          fi

      - name: Build every page
        run: node tools/build.js

      # Keep the repository equal to what is live, so a local clone that pulls
      # sees the admin's edits and the tiers cut for its uploads.
      - name: Commit generated files back
        run: |
          git config user.name "coravida-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- assets/img assets/js content/media.json sitemap.xml '*.html' ru zh de excursions
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "Build: pages regenerated [skip ci]"
            git push
          fi

      - name: Assemble the site
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github --exclude tools --exclude node_modules \
                   --exclude assets/src --exclude _site --exclude README.md --exclude .gitignore ./ _site/
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
