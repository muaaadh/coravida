<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Coravida · Admin</title>
<link rel="icon" href="../assets/img/favicon.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<aside class="side" id="side">
  <div class="side__top">
    <a class="side__brand" href="#overview">
      <img src="../assets/img/logo-mark.webp" alt="" width="28" height="28">
      <span>Coravida <em>Admin</em></span>
    </a>
    <button class="side__x" id="sideX" type="button" aria-label="Close menu">✕</button>
  </div>
  <nav class="side__nav" id="nav" aria-label="Admin"></nav>
  <div class="side__foot">
    <a href="../" target="_blank" rel="noopener">View the site ↗</a>
    <span id="sideVer"></span>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<div class="main" id="main">
  <header class="top">
    <button class="top__menu" id="menuBtn" type="button" aria-controls="side" aria-expanded="false"><i></i>Menu</button>
    <h1 class="top__h" id="topH">Overview</h1>
    <div class="top__r">
      <span class="top__status" id="status">Starting…</span>
      <span class="dirty" id="dirty" hidden>Unpublished changes</span>
      <button class="btn btn--ghost" id="btn-discard" type="button" hidden>Discard</button>
      <button class="btn btn--go" id="btn-publish" type="button" disabled>Publish</button>
    </div>
  </header>
  <div class="view" id="view"></div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal__card">
    <h2 class="modal__h" id="modal-title"></h2>
    <div class="modal__body" id="modal-body"></div>
    <div class="modal__acts" id="modal-acts"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script src="app.js"></script>
<script src="content.js"></script>
<script src="books.js"></script>
<script>Admin.boot();</script>
</body>
</html>
